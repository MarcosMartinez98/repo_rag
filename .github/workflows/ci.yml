name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  # Dummy values so pydantic-settings can import without a real .env
  COHERE_API_KEY: "test-key-for-ci"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff — lint
        run: poetry run ruff check src/ tests/

      - name: Ruff — format check
        run: poetry run ruff format --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Mypy
        run: poetry run mypy src/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run unit tests
        run: poetry run pytest -m "not integration" --cov=rag_course --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Build & push to ECR ────────────────────────────────────────────────────
  # Only runs on direct pushes to main (not on PRs).
  # Requires three GitHub secrets:
  #   AWS_ROLE_ARN     — IAM role GitHub can assume to push to ECR
  #   AWS_REGION       — e.g. eu-west-1
  #   ECR_REGISTRY     — e.g. 123456789.dkr.ecr.eu-west-1.amazonaws.com
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]   # only runs if all quality gates pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write   # needed for OIDC authentication with AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      # OIDC: GitHub assumes an AWS IAM role without storing long-lived credentials.
      # This is the secure, modern approach — no AWS_ACCESS_KEY_ID in secrets.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Podman
        run: sudo apt-get update -qq && sudo apt-get install -y podman

      - name: Build image
        run: |
          podman build \
            --file Containerfile \
            --tag rag-course:${{ github.sha }} \
            .

      - name: Push to ECR
        run: |
          ECR_URI="${{ secrets.ECR_REGISTRY }}/rag-course"
          podman tag "rag-course:${{ github.sha }}" "${ECR_URI}:${{ github.sha }}"
          podman tag "rag-course:${{ github.sha }}" "${ECR_URI}:latest"
          podman push "${ECR_URI}:${{ github.sha }}"
          podman push "${ECR_URI}:latest"
          echo "Pushed: ${ECR_URI}:${{ github.sha }}"
